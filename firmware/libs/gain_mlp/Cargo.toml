[package]
name = "gain_mlp"
version = "0.1.0"
edition = "2024"
description = "no_std error-MLP gain parametrization for the Pololu firmware, exported from wmr-simulator (GAINMLP.JSN)."

[lib]
crate-type = ["rlib"]

[dependencies]
libm = "0.2"
heapless = { version = "0.8", default-features = false, features = ["serde"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = "0.5"

[dev-dependencies]
serde_json = "1"
